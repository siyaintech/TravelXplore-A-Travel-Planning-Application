{% extends "layout.html" %}
{% block content %}

<div class="mb-4">
    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>

<div class="p-4 rounded mb-4" style="background:#111; color:white;">
    <h2>🎯 Best Activities in {{ city }}</h2>
    <p class="mb-0" style="color:rgba(255,255,255,0.6);">Things to do for memories worth keeping</p>
</div>

<div class="row g-4">
    {% for place in activities %}
    <div class="col-md-4">
        <div class="card h-100 shadow-sm border-0" style="border-radius:12px; overflow:hidden;">
            <img src="{{ place.img }}" alt="{{ place.name }}"
                 style="height:200px; object-fit:cover; width:100%;"
                 onerror="this.src='https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600'">
            <div class="card-body">
                <h5 class="card-title fw-bold">{{ place.name }}</h5>
                <p class="card-text text-muted" style="font-size:0.9rem;">An exciting activity in {{ city }}.</p>
                <span class="badge" style="background:#2a9d8f; color:white;">Activity</span>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
